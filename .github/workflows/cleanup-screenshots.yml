name: Archive screenshots ref

# When a PR closes (merged or not), move refs/screenshots/<branch> to an
# archive ref keyed by PR number. Deleting it outright would let GitHub
# garbage-collect the orphan screenshot commits, breaking every image in the
# merged PR's comment — the visual record matters most after the merge.
# Archiving keeps the commits reachable while freeing the branch namespace.
on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  archive:
    name: Archive screenshots ref
    runs-on: ubuntu-latest
    # Fork PRs never created a ref (read-only token), so only run for same-repo branches.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Move refs/screenshots/${{ github.head_ref }} to archive
        run: |
          SRC="refs/screenshots/${{ github.head_ref }}"
          DST="refs/screenshots/closed/pr-${{ github.event.pull_request.number }}"
          if git fetch origin "${SRC}:refs/tmp-screenshots"; then
            git push origin "refs/tmp-screenshots:${DST}" --force
            git push origin ":${SRC}"
          else
            echo "No screenshots ref to archive"
          fi
