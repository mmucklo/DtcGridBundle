framework:
    secret: test_secret_for_screenshots
    test: true
    router:
        resource: '%kernel.project_dir%/config/routes.yaml'
    http_method_override: false

twig:
    paths:
        '%kernel.project_dir%/../../Resources/views': DtcGrid

doctrine:
    dbal:
        driver: pdo_sqlite
        path: '%kernel.cache_dir%/test.db'
    orm:
        auto_generate_proxy_classes: true
        auto_mapping: false
        mappings:
            App:
                type: attribute
                dir: '%kernel.project_dir%/Entity'
                prefix: 'Dtc\GridBundle\Tests\App\Entity'
                alias: App
                is_bundle: false

dtc_grid:
    reflection:
        allowed_entities: '*'
